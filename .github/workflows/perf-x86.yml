# Where the x86_64 wall goes, stage by stage (issues #20, #32).
#
# The measurement this repo owes. On Apple Silicon we are at parity with fg-labs/bwa-mem3 (0.981x,
# real GIAB, PGO); off it we are at 0.71x on Zen 3 and 0.76x on a hosted runner, reproducibly. Every
# explanation so far has been a guess, because the ARM profile is the only one anyone has read: on
# ARM, seeding plus chaining is ~78% and extension ~22%, and mate rescue is 47-64% of paired-end
# compute. Nothing says those shares hold on x86, where the vector kernels are different code.
#
# So this job runs OUR probes on x86 and prints them next to the fork's wall clock on the same host:
# per-stage wall (BWA4_STAGE_TIME), per-region pool occupancy (BWA4_BARRIER_TIME), the align stage's
# internal split (BWA4_ALIGN_SPLIT, which needs its own build), chaining and SA resolution
# (BWA4_CHAIN_TIME), the rescue kernel's cell rate (BWA4_MATESW_TIME), and a scalar-vs-AVX2 sweep of
# that kernel. A deficit has to show up in one of those or it is not in the aligner at all.
#
# Manual dispatch only, like bench-x86: cloud runners are noisy, and what is readable here are
# shares and ratios taken inside one job on one host.
name: perf-x86

on:
  # TEMPORARY, removed before this branch merges: a workflow_dispatch workflow is only reachable by
  # name once its file is on the default branch, so the first run of a new one has to come from a
  # push on the branch that introduces it.
  push:
    branches: [perf/alloc-probe]
  workflow_dispatch:
    inputs:
      read_pairs:
        description: "Read pairs to simulate"
        default: "2000000"
        required: false

jobs:
  perf-x86:
    name: where the x86 wall goes, ours against the fork
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0} # login shell so the micromamba env is active
    steps:
      - uses: actions/checkout@v7

      - name: Log the host
        shell: bash
        run: |
          echo "model: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
          # -o without -m1: with -o, grep -m1 stops after the first MATCH, not the first matching
          # line, which is how bench-x86 printed a bare "avx2" on hosts that had avx512bw too.
          echo -n "simd: "; grep -o -E 'avx2|avx512bw|avx512f|avx512vl' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          echo "nproc: $(nproc)"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"

      - uses: Swatinem/rust-cache@v2

      - name: Install bwa-mem2 + bwa-mem3 + wgsim (bioconda)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: bench
          condarc: |
            channels:
              - conda-forge
              - bioconda
          create-args: >-
            bwa-mem2
            bwa-mem3
            wgsim
          init-shell: bash

      # Two builds: the shipped one carries every probe that costs nothing when off, and a second
      # one carries `align-split`, which is a Cargo feature precisely because its wrapper is a
      # barrier the inliner does not always see through. Timing the align stage's internals with the
      # shipped binary is not possible, and timing the WHOLE run with the align-split binary would
      # measure the probe.
      - name: Build bwa-mem4, shipped and align-split
        shell: bash
        run: |
          cargo build --release -p bwa-mem4
          cp target/release/bwa-mem4 ./bwa-mem4-shipped
          cargo build --release -p bwa-mem4 --features align-split --target-dir target-split
          cp target-split/release/bwa-mem4 ./bwa-mem4-split

      - name: Fetch reference (GRCh38 chr21)
        run: |
          mkdir -p work && cd work
          url="https://ftp.ensembl.org/pub/release-110/fasta/homo_sapiens/dna/Homo_sapiens.GRCh38.dna.chromosome.21.fa.gz"
          curl -fsSL --retry 3 "$url" -o chr21.fa.gz
          gunzip -f chr21.fa.gz

      - name: Build shared index
        run: cd work && bwa-mem2 index chr21.fa

      - name: Simulate reads
        run: |
          cd work
          n="${{ github.event.inputs.read_pairs || '2000000' }}"
          wgsim -S 11 -N "$n" -1 150 -2 150 chr21.fa r1.fq r2.fq > /dev/null
          echo "simulated $n pairs"

      - name: The gap, on this host
        run: |
          cd work
          T="$(nproc)"; [ "$T" -gt 8 ] && T=8
          M4=../bwa-mem4-shipped
          timed() { /usr/bin/time -f '%e' -o t.txt "$@" > /dev/null 2>/dev/null; cat t.txt; }
          $M4 mem -t "$T" chr21.fa r1.fq r2.fq > /dev/null 2>/dev/null   # warm
          echo "threads=$T"
          for rep in 1 2 3; do
            m4=$(timed $M4 mem -t "$T" chr21.fa r1.fq r2.fq)
            fk=$(timed bwa-mem3 mem -t "$T" chr21.fa r1.fq r2.fq)
            m2=$(timed bwa-mem2 mem -t "$T" chr21.fa r1.fq r2.fq)
            echo "rep $rep: bwa-mem4 ${m4}s | bwa-mem3 ${fk}s | bwa-mem2 ${m2}s"
          done

      # Everything below is one run each: these are shares, and a share does not need repeating the
      # way a wall-clock difference does.
      - name: Where our wall goes (stages, occupancy, kernels)
        run: |
          cd work
          T="$(nproc)"; [ "$T" -gt 8 ] && T=8
          M4=../bwa-mem4-shipped
          SP=../bwa-mem4-split
          run_probe() {
            local title="$1"; shift
            echo
            echo "===== $title ====="
            "$@" mem -t "$T" chr21.fa r1.fq r2.fq > /dev/null 2> probe.err || { echo "FAILED"; tail -5 probe.err; return; }
            grep -E '^\[(stage-time|barrier|align-split|chain-time|matesw|traffic|seed)' probe.err || tail -20 probe.err
          }
          # Every probe below runs with ONE batch in flight. `BWA4_STAGE_TIME`'s accumulators are
          # process-wide, so with the overlap on, two batches credit the same stage counters and the
          # table sums past 100% (measured on ARM: encode reads 29.8% and the total 197%). The stage
          # SHARES are the whole point here, so they are taken where they are exact. It costs 1.1%
          # of wall, which no share in this step is sensitive to.
          NOOV="BWA4_NO_BATCH_OVERLAP=1"
          run_probe "per-stage wall (BWA4_STAGE_TIME)"      env $NOOV BWA4_STAGE_TIME=1 $M4
          run_probe "pool occupancy per region (BWA4_BARRIER_TIME)" env $NOOV BWA4_BARRIER_TIME=1 $M4
          run_probe "chaining and SA resolution (BWA4_CHAIN_TIME)"  env $NOOV BWA4_CHAIN_TIME=1 $M4
          run_probe "rescue kernel cells (BWA4_MATESW_TIME)"        env $NOOV BWA4_MATESW_TIME=1 $M4
          run_probe "align internals (BWA4_ALIGN_SPLIT, split build)" env $NOOV BWA4_ALIGN_SPLIT=1 $SP

          echo
          echo "===== SA prefetch window sweep (BWA4_SA_WINDOW) ====="
          # The window is the count of LF-walks kept in flight, i.e. how many DRAM misses are
          # outstanding at once, and it was swept to 128 on an M4. Zen 3 and M4 do not have the same
          # number of outstanding-miss slots, so the knee need not be in the same place. 128 is the
          # compile-time ceiling, so this can only narrow: a wider optimum would show up as a curve
          # still falling at 128, and would need a rebuild to confirm.
          for w in 16 32 64 96 128; do
            s=$( { /usr/bin/time -f '%e' -o w.txt env BWA4_NO_BATCH_OVERLAP=1 BWA4_SA_WINDOW=$w $M4 mem -t "$T" chr21.fa r1.fq r2.fq >/dev/null; } 2>/dev/null; cat w.txt)
            echo "  W=$w: ${s}s"
          done

      # bwa-mem2, and the fork with it, SHIP one binary per instruction set (`bwa-mem2.avx2`,
      # `bwa-mem2.avx512bw`) and pick at exec time. We ship one baseline binary and select only the
      # rescue and extension kernels at runtime, which leaves every scalar loop in seeding, chaining
      # and SA resolution compiled for a 2003 CPU. That is a plausible slice of the x86 deficit and
      # it has never been measured, so here it is measured: same source, three instruction-set
      # levels, one host.
      - name: What the instruction set is worth (baseline vs v2 vs v3)
        run: |
          cd "$GITHUB_WORKSPACE"
          T="$(nproc)"; [ "$T" -gt 8 ] && T=8
          for lvl in "" "x86-64-v2" "x86-64-v3"; do
            name="${lvl:-baseline}"
            if [ -z "$lvl" ]; then export RUSTFLAGS=""; else export RUSTFLAGS="-C target-cpu=$lvl"; fi
            cargo build --release -p bwa-mem4 --target-dir "target-$name" 2>/dev/null | tail -1
            cp "target-$name/release/bwa-mem4" "./bwa-mem4-$name"
          done
          unset RUSTFLAGS
          cd work
          for name in baseline x86-64-v2 x86-64-v3; do
            ../bwa-mem4-$name mem -t "$T" chr21.fa r1.fq r2.fq >/dev/null 2>/dev/null   # warm
          done
          for rep in 1 2; do
            line="rep $rep:"
            for name in baseline x86-64-v2 x86-64-v3; do
              s=$( { /usr/bin/time -f '%e' -o b.txt ../bwa-mem4-$name mem -t "$T" chr21.fa r1.fq r2.fq >/dev/null; } 2>/dev/null; cat b.txt)
              line="$line $name ${s}s |"
            done
            echo "$line"
          done
          echo "== and they must all produce the same bytes =="
          for name in baseline x86-64-v2 x86-64-v3; do
            ../bwa-mem4-$name mem -t "$T" chr21.fa r1.fq r2.fq 2>/dev/null | grep -v '^@PG' | md5sum
          done

      # Two kernels, two sweeps. The rescue kernel is the one the x86 issues have looked at; the
      # BATCHED EXTENSION kernel is the bigger one and nobody has priced it on x86. The ARM
      # align-split profile makes the case: of 94.94 s of align CPU on this same data, extension
      # kernels are 53.63 s, i.e. 56%, against 17.23 s of seeding. If our AVX2 extension is weaker
      # relative to the fork's than our NEON one is, that is where a 25% deficit can live.
      - name: Kernel tier sweeps (extension, then rescue)
        run: |
          cd work
          T="$(nproc)"; [ "$T" -gt 8 ] && T=8
          M4=../bwa-mem4-shipped
          echo "== batched extension tier (BWA4_EXTEND_TIER) =="
          for tier in scalar sse41 avx2 avx512; do
            if timeout 1800 /usr/bin/time -f '%e' -o et.txt env BWA4_EXTEND_TIER="$tier" $M4 mem -t "$T" chr21.fa r1.fq r2.fq > /dev/null 2>/dev/null; then
              echo "  extend tier=$tier: $(cat et.txt)s"
            else
              echo "  extend tier=$tier: timed out or unavailable"
            fi
          done
          echo "== rescue tier (BWA4_RESCUE_TIER) =="
          # A forced tier the host lacks falls back to scalar, and forced scalar is legitimately an
          # order of magnitude slower on this stage, so a timeout here is reported and not fatal.
          for tier in scalar avx2 avx512; do
            if timeout 1800 /usr/bin/time -f '%e' -o tt.txt env BWA4_RESCUE_TIER="$tier" $M4 mem -t "$T" chr21.fa r1.fq r2.fq > /dev/null 2>/dev/null; then
              echo "tier=$tier: $(cat tt.txt)s"
            else
              echo "tier=$tier: timed out or unavailable"
            fi
          done
