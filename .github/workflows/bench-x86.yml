# x86_64 performance measurement. Deliberately NOT a gating check and NOT on push: benchmarks on
# shared cloud runners are noisy, and a red X on a noisy number teaches nothing. Runs on manual
# dispatch and weekly, and prints results for a human to read.
#
# Two jobs, matching the two honest levels of an x86 measurement (see the README caveat and
# crates/bwa-neon/src/matesw.rs):
#   kernel-ab          scalar vs AVX2 vs AVX-512 rescue-kernel throughput, all three timed in ONE
#                      process on ONE runner, so the CPU model and noisy neighbours cancel in the
#                      ratio. This is the trustworthy signal for whether the vector kernels help.
#   endtoend-smallref  bwa-mem4 vs bwa-mem2 on a single human chromosome, both interleaved in one
#                      job. A real whole-pipeline number, but small-scale and cloud-noisy by nature,
#                      so read it as directional, not as the headline ratio.
name: bench-x86

on:
  workflow_dispatch:
    inputs:
      read_pairs:
        description: "Read pairs to simulate for the end-to-end job"
        default: "1000000"
        required: false
      # GitHub's ubuntu-22.04 pool is heterogeneous: an Intel draw reports avx512bw and an AMD draw
      # does not, and which one you get is luck. The AVX-512 kernels have therefore never been TIMED
      # (the 2026-08-03 run drew AMD and printed "avx512_u8 skipped"), while their byte-identity
      # tests DID run on an Intel CI draw the next day. Since the kernel A/B job takes about one
      # minute and the end-to-end job takes an hour, this switch makes "dispatch again until the
      # pool gives us AVX-512 hardware" a cheap thing to do rather than an hour-long one.
      kernel_ab_only:
        description: "Run only the one-minute kernel A/B job (use to re-draw for an AVX-512 runner)"
        type: boolean
        default: false
        required: false
      # The x86 work of issues #43, #44, #46C and #48C was written and gated on an arm64 machine,
      # where the x86 binary only runs under Rosetta and speed ratios do not hold. Every one of those
      # issues therefore owes a NUMBER. This input is how it is paid: the kernel job builds and probes
      # the current ref AND this base ref on the same runner, back to back, and prints both.
      base_ref:
        description: "Commit/tag to compare the kernel probes against (empty = skip the comparison)"
        default: "7428cd0"
        required: false
      # A GitHub ubuntu-22.04 draw is either Intel (has avx512bw) or AMD (does not), and which one is
      # luck. The AVX-512 u8 rescue kernel of #44 was written with NO executed coverage at all, so its
      # close condition is one green run on an Intel draw. Setting this makes an AMD draw fail fast
      # and loudly instead of self-skipping, so "dispatch again" is a one-minute loop.
      require_avx512:
        description: "Fail the kernel job unless the runner has avx512bw (re-draw until Intel)"
        type: boolean
        default: false
        required: false
      # 17 consecutive `ubuntu-22.04` draws on 2026-08-09 all returned the same AMD EPYC 7763, so on
      # that image the Intel lottery is not a lottery. The image label is an input so a different
      # pool can be tried (`ubuntu-24.04`, `ubuntu-latest`) without editing this file, which is the
      # only remaining lever for getting #44's AVX-512 kernel executed at all.
      runner:
        description: "Runner image for the kernel job (ubuntu-22.04 | ubuntu-24.04 | ubuntu-latest)"
        default: "ubuntu-22.04"
        required: false
      # The end-to-end job was pinned to `ubuntu-22.04`, whose pool is uniformly AMD EPYC 7763, so
      # every end-to-end number this project has ever published on x86 is a Zen 3 number. The
      # `ubuntu-24.04` pool now draws Intel parts that expose avx512bw (a Xeon Platinum 8573C,
      # Emerald Rapids, on 2026-08-26), which is what makes an Intel end-to-end reachable at all.
      e2e_runner:
        description: "Runner image for the end-to-end job (ubuntu-22.04 | ubuntu-24.04)"
        default: "ubuntu-22.04"
        required: false
      # Same fail-fast idea as `require_avx512`, for the hour-long job: an AMD draw dies in about a
      # minute instead of spending an hour producing a number that is not the one being hunted.
      require_avx512_e2e:
        description: "Fail the end-to-end job unless the runner has avx512bw (re-draw until Intel)"
        type: boolean
        default: false
        required: false
      # A SECOND binary of the same source, compiled for a narrower CPU (`x86-64-v4` = AVX-512F/BW/
      # VL/DQ, `x86-64-v3` = AVX2), timed beside the baseline one in the same interleaved loop. This
      # is the measurement behind the residual wgsim gap against the fork: their advantage is
      # per-tier builds of the whole SCALAR GLUE, not of the kernels, which we already dispatch at
      # run time. Empty = do not build a variant.
      variant_cpu:
        description: "Also build and time a -C target-cpu variant (e.g. x86-64-v4), empty = none"
        default: ""
        required: false
  schedule:
    # Mondays 05:00 UTC, offset from the parity/CI schedules.
    - cron: "0 5 * * 1"

concurrency:
  group: bench-x86-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Ship-baseline codegen: the SIMD kernels are chosen at RUNTIME by feature detection, so an empty
  # RUSTFLAGS still runs AVX2/AVX-512 on a runner that has them. This makes the end-to-end job time
  # the same code path the released binary takes. (Overrides .cargo/config.toml's target-cpu=native.)
  RUSTFLAGS: ""
  CARGO_TERM_COLOR: always

jobs:
  kernel-ab:
    name: kernel probes (rescue + extension, vs base_ref)
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-22.04' }}
    timeout-minutes: 60
    steps:
      # Full history: the base-ref comparison below checks the base out as a worktree.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log CPU SIMD features
        shell: bash
        run: |
          echo "model: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
          # NOT `-m1`: with `-o`, GNU grep's `-m1` stops after the FIRST MATCH, not the first
          # matching line, so this printed a bare "avx2" even where avx512f and avx512bw were both
          # present on the same flags line. It has been lying in every run of this workflow.
          echo -n "simd: "; grep -o -E 'avx2|avx512bw|avx512f|avx512vl' /proc/cpuinfo | sort -u | tr '\n' ' '; echo

      # Fails the job on an AMD draw when the dispatch asked for AVX-512, so re-dispatching is the
      # whole recovery. Without this the AVX-512 arms self-skip and the run looks green while having
      # tested nothing of #44.
      - name: Require AVX-512 (when asked)
        if: github.event.inputs.require_avx512 == 'true'
        run: |
          grep -q avx512bw /proc/cpuinfo || {
            echo "::error::this draw has no avx512bw; re-dispatch with require_avx512 until an Intel runner comes up"
            exit 1
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"

      - uses: Swatinem/rust-cache@v2

      # The byte-identity gate for the x86 kernels, on real x86 rather than under Rosetta. On an
      # Intel draw this is what actually executes `avx512_matesw_u8_matches_scalar` and
      # `avx512_u8_and_i16_match_scalar`, which is the close condition of issue #44: that kernel is
      # reachable on no other machine available to this project.
      - name: Byte-identity tests (x86 kernels, native)
        run: cargo test --release -p bwa-mem4-neon

      # The probes are `#[ignore]`d in-crate tests; `--ignored --nocapture` runs them and prints their
      # tables. Where the runner lacks avx512bw the AVX-512 lines self-skip (the SIMD-features step
      # above shows whether that happened).
      - name: Kernel probes, current ref
        run: |
          echo "=== HEAD ($(git rev-parse --short HEAD)) ==="
          cargo test --release -p bwa-mem4-neon rescue_kernel_ab -- --ignored --nocapture
          cargo test --release -p bwa-mem4-neon x86_extend_ab -- --ignored --nocapture

      # Same runner, same toolchain, back to back: the only fair way to give the x86 issues a number
      # when the changes are compile-time choices with no in-binary switch left. Read it as a
      # two-binary comparison, which is what it is, not as an interleaved A/B.
      - name: Kernel probes, base ref
        if: github.event.inputs.base_ref != ''
        run: |
          base="${{ github.event.inputs.base_ref || '7428cd0' }}"
          git worktree add ../base "$base"
          cd ../base
          echo "=== BASE ($base) ==="
          cargo test --release -p bwa-mem4-neon rescue_kernel_ab -- --ignored --nocapture
          # The extension probe does not exist before the commit that added it; that is expected on
          # an old base and is not a failure of the run.
          cargo test --release -p bwa-mem4-neon x86_extend_ab -- --ignored --nocapture \
            || echo "(base ref has no x86_extend_ab probe; rescue numbers above are the comparison)"

  endtoend-smallref:
    name: end-to-end vs bwa-mem2 + whole-process A/B vs base_ref
    # Skipped when the dispatch asked for a kernel-A/B-only re-draw. The condition is written against
    # the string 'true' because a workflow_dispatch input arrives as a string even when typed boolean,
    # and it must stay true for the weekly schedule, where `inputs` is empty.
    if: github.event.inputs.kernel_ab_only != 'true'
    runs-on: ${{ github.event.inputs.e2e_runner || 'ubuntu-22.04' }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0} # login shell so the micromamba env is active
    steps:
      # Full history: the whole-process A/B below checks the base ref out as a worktree.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log CPU SIMD features
        shell: bash
        run: |
          echo "model: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
          # NOT `-m1`: with `-o`, GNU grep's `-m1` stops after the FIRST MATCH, not the first
          # matching line, so this printed a bare "avx2" even where avx512f and avx512bw were both
          # present on the same flags line. It has been lying in every run of this workflow.
          echo -n "simd: "; grep -o -E 'avx2|avx512bw|avx512f|avx512vl' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          echo "nproc: $(nproc)"

      # Before the hour, not after it. Without this an AMD draw spends 45 minutes producing another
      # Zen 3 number while the run was dispatched to get an Intel one.
      - name: This draw must have avx512bw
        if: github.event.inputs.require_avx512_e2e == 'true'
        shell: bash
        run: |
          grep -q avx512bw /proc/cpuinfo || {
            echo "::error::this draw has no avx512bw; re-dispatch until an Intel runner comes up"
            exit 1
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"

      - uses: Swatinem/rust-cache@v2

      - name: Install bwa-mem2 + wgsim + samtools (bioconda)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: bench
          # setup-micromamba@v2 has no `channels:` input; channels go through condarc.
          condarc: |
            channels:
              - conda-forge
              - bioconda
          create-args: >-
            bwa-mem2
            bwa-mem3
            wgsim
            samtools
          init-shell: bash

      - name: Build bwa-mem4 (release)
        shell: bash
        run: cargo build --release -p bwa-mem4

      # The same source, compiled for the narrower CPU. Separate target dir so it cannot overwrite
      # the baseline binary, and `--locked` for the same dependency set. This is what a per-tier
      # release artifact would be, so timing it here is what decides whether shipping one is worth
      # the packaging.
      - name: Build the ${{ github.event.inputs.variant_cpu }} variant
        if: github.event.inputs.variant_cpu != ''
        shell: bash
        env:
          RUSTFLAGS: -C target-cpu=${{ github.event.inputs.variant_cpu }}
          CARGO_TARGET_DIR: target-variant
        run: |
          cargo build --release --locked -p bwa-mem4
          ls -la target-variant/release/bwa-mem4

      - name: Fetch reference (GRCh38 chr21)
        run: |
          mkdir -p work && cd work
          url="https://ftp.ensembl.org/pub/release-110/fasta/homo_sapiens/dna/Homo_sapiens.GRCh38.dna.chromosome.21.fa.gz"
          curl -fsSL --retry 3 "$url" -o chr21.fa.gz
          gunzip -f chr21.fa.gz
          ls -la chr21.fa

      - name: Build shared index
        run: |
          cd work
          # Build with bwa-mem2's own indexer so the index is unambiguously bwa-mem2-readable;
          # bwa-mem4 reads the identical files. (Building it with bwa-mem4 and feeding bwa-mem2 is
          # what silently hung the first run.)
          bwa-mem2 index chr21.fa
          ls -la chr21.fa.*

      - name: Simulate reads
        run: |
          cd work
          n="${{ github.event.inputs.read_pairs || '1000000' }}"
          # Fixed seed so the read set is reproducible across runs.
          wgsim -S 11 -N "$n" -1 150 -2 150 chr21.fa r1.fq r2.fq > /dev/null
          echo "simulated $n pairs"

      - name: Interleaved head-to-head
        run: |
          cd work
          # Cap threads: a shared runner exposes few usable vCPUs even when nproc is large, and
          # oversubscribing thrashes. Every alignment is wrapped in `timeout` so a hang fails the
          # step in minutes with a visible message instead of eating the 60-min budget silently.
          T="$(nproc)"; [ "$T" -gt 8 ] && T=8
          M2=bwa-mem2
          # The fork (fg-labs/bwa-mem3) is what #20/#27 actually benchmark against, not bwa-mem2.
          # bioconda ships it as the `bwa-mem3` executable and it reads the same bwa-mem2 index.
          FORK=bwa-mem3
          M4=../target/release/bwa-mem4
          echo "threads=$T"
          # Runs the aligner under /usr/bin/time with a hard timeout; prints "wall_s maxrss_kb".
          # $1 = label (for the failure message), rest = command.
          run_one() {
            local label="$1"; shift
            if ! timeout 300 /usr/bin/time -f '%e %M' -o t.txt "$@" > /dev/null 2>err.txt; then
              echo "FAILED/timeout: $label" >&2; tail -20 err.txt >&2; exit 1
            fi
            cat t.txt
          }

          echo "== warm-up (untimed, verifies all three aligners read the index) =="
          run_one "warmup bwa-mem2" $M2 mem -t "$T" chr21.fa r1.fq r2.fq > /dev/null
          $M2 mem -t "$T" chr21.fa r1.fq r2.fq > m2.sam 2>/dev/null
          run_one "warmup bwa-mem3" $FORK mem -t "$T" chr21.fa r1.fq r2.fq > /dev/null
          run_one "warmup bwa-mem4" $M4 mem -t "$T" chr21.fa r1.fq r2.fq > /dev/null
          $M4 mem -t "$T" chr21.fa r1.fq r2.fq > m4.sam 2>/dev/null

          echo "== record identity (informational; parity.yml is the real gate) =="
          m2md5=$(grep -v '^@' m2.sam | md5sum | cut -d' ' -f1)
          m4md5=$(grep -v '^@' m4.sam | md5sum | cut -d' ' -f1)
          if [ "$m2md5" = "$m4md5" ]; then echo "records byte-identical ($m2md5)"; else echo "records DIFFER: mem2=$m2md5 mem4=$m4md5"; fi

          # The tier variant, when one was asked for: same source, compiled for a narrower CPU, timed
          # in the SAME interleaved loop so a machine that drifts drifts under both.
          VAR=../target-variant/release/bwa-mem4
          have_var=0
          if [ -x "$VAR" ]; then
            have_var=1
            run_one "warmup variant" $VAR mem -t "$T" chr21.fa r1.fq r2.fq > /dev/null
            $VAR mem -t "$T" chr21.fa r1.fq r2.fq > mv.sam 2>/dev/null
            vmd5=$(grep -v '^@' mv.sam | md5sum | cut -d' ' -f1)
            # A faster binary that changed the output is not a faster binary. `-C target-cpu` is not
            # supposed to move a single byte, and this is where that claim is checked on the tier
            # actually being considered for release.
            if [ "$vmd5" = "$m4md5" ]; then
              echo "variant records byte-identical to the baseline build ($vmd5)"
            else
              echo "::error::variant SAM differs from the baseline build: $vmd5 vs $m4md5"; exit 1
            fi
          fi

          echo "== timed reps (interleaved, best-of 2) =="
          best_m2=""; best_fk=""; best_m4=""; best_var=""
          for rep in 1 2; do
            r2=$(run_one "mem2 rep$rep" $M2 mem -t "$T" chr21.fa r1.fq r2.fq); w2=${r2%% *}
            rf=$(run_one "fork rep$rep" $FORK mem -t "$T" chr21.fa r1.fq r2.fq); wf=${rf%% *}
            r4=$(run_one "mem4 rep$rep" $M4 mem -t "$T" chr21.fa r1.fq r2.fq); w4=${r4%% *}
            line="rep $rep: bwa-mem2 ${r2} | bwa-mem3 ${rf} | bwa-mem4 ${r4}"
            if [ "$have_var" = 1 ]; then
              rv=$(run_one "variant rep$rep" $VAR mem -t "$T" chr21.fa r1.fq r2.fq); wv=${rv%% *}
              line="$line | variant ${rv}"
              best_var=$(awk -v a="$best_var" -v b="$wv" 'BEGIN{print (a=="")?b:(b<a?b:a)}')
            fi
            echo "$line  (wall_s maxrss_kb)"
            best_m2=$(awk -v a="$best_m2" -v b="$w2" 'BEGIN{print (a=="")?b:(b<a?b:a)}')
            best_fk=$(awk -v a="$best_fk" -v b="$wf" 'BEGIN{print (a=="")?b:(b<a?b:a)}')
            best_m4=$(awk -v a="$best_m4" -v b="$w4" 'BEGIN{print (a=="")?b:(b<a?b:a)}')
          done

          # Rescue-kernel tier sweep on bwa-mem4, same host, same data (BWA4_RESCUE_TIER, mirroring
          # the fork's BWAMEM3_FORCE_TIER). Attributes end-to-end time to the rescue kernel: the
          # avx512-vs-avx2 delta is the real-hardware answer to whether the 512-bit kernel helps,
          # which the bwa-mem2 head-to-head cannot isolate. A forced tier absent on this host falls
          # back to scalar (watch for the "[bwa-mem4] BWA4_RESCUE_TIER=..." stderr line).
          # Informational, so a slow tier must NOT fail the job: the forced-scalar rescue is
          # legitimately ~an order of magnitude slower (not hung), so it gets a longer budget and a
          # timeout is reported, not fatal. The `if` consumes the exit code so `set -e` stays happy.
          echo "== bwa-mem4 rescue-tier sweep (same host, 1 rep each) =="
          for T4 in scalar avx2 avx512; do
            export BWA4_RESCUE_TIER="$T4"
            if timeout 900 /usr/bin/time -f '%e' -o tt.txt $M4 mem -t "$T" chr21.fa r1.fq r2.fq >/dev/null 2>/dev/null; then
              echo "  tier=$T4: $(cat tt.txt)s"
            else
              echo "  tier=$T4: timed out (>900s) or failed"
            fi
            unset BWA4_RESCUE_TIER
          done

          echo
          echo "== summary (single chr21, $T threads, cloud-noisy: DIRECTIONAL ONLY) =="
          echo "best wall: bwa-mem2 ${best_m2}s | bwa-mem3 ${best_fk}s | bwa-mem4 ${best_m4}s"
          awk -v m2="$best_m2" -v m4="$best_m4" 'BEGIN{printf "bwa-mem4 vs bwa-mem2: %.2fx\n", m2/m4}'
          # The number #20/#27 care about: us vs the fork on x86. >1 means bwa-mem4 wins.
          awk -v fk="$best_fk" -v m4="$best_m4" 'BEGIN{printf "bwa-mem4 vs fork (bwa-mem3): %.2fx  (>1 = we win)\n", fk/m4}'
          if [ "$have_var" = 1 ]; then
            echo "variant (${{ github.event.inputs.variant_cpu }}) best wall: ${best_var}s"
            awk -v b="$best_m4" -v v="$best_var" 'BEGIN{printf "variant vs baseline build: %.3fx  (>1 = the tier build is faster)\n", b/v}'
            awk -v fk="$best_fk" -v v="$best_var" 'BEGIN{printf "variant vs fork (bwa-mem3): %.2fx  (>1 = we win)\n", fk/v}'
          fi

      # The measurement the x86 issues actually owe: not "how do we compare to bwa-mem2", but "did
      # our own changes make the WHOLE PROCESS faster on x86". The kernel probes answer it per
      # kernel; this answers it for the binary.
      #
      # Both binaries run on the same runner, on the same index and the same reads, INTERLEAVED, and
      # bwa-mem2 is timed alongside as a drift canary: if the machine slows down mid-run, its number
      # moves too and the comparison is discarded rather than believed.
      - name: Whole-process A/B vs base_ref
        if: github.event.inputs.base_ref != ''
        run: |
          base="${{ github.event.inputs.base_ref || '7428cd0' }}"
          git worktree add ../base "$base"
          (cd ../base && cargo build --release -p bwa-mem4)
          cd work
          T="$(nproc)"; [ "$T" -gt 8 ] && T=8
          HEAD_BIN=../target/release/bwa-mem4
          BASE_BIN=../../base/target/release/bwa-mem4
          M2=bwa-mem2
          echo "base=$base threads=$T"
          # Byte-identity first. A speed comparison between two binaries that do not agree on the
          # output is meaningless, and this is also a real gate: the whole batch claims identity.
          "$BASE_BIN" mem -t "$T" chr21.fa r1.fq r2.fq 2>/dev/null | grep -v '^@' | md5sum > base.md5
          "$HEAD_BIN" mem -t "$T" chr21.fa r1.fq r2.fq 2>/dev/null | grep -v '^@' | md5sum > head.md5
          echo "base md5: $(cat base.md5)"
          echo "head md5: $(cat head.md5)"
          cmp -s base.md5 head.md5 || { echo "::error::base and HEAD disagree on the SAM body"; exit 1; }

          t_of() { /usr/bin/time -f '%e' -o w.txt "$@" >/dev/null 2>/dev/null; cat w.txt; }
          bb=""; hh=""; mm=""; wins=0
          for rep in 1 2 3; do
            b=$(t_of "$BASE_BIN" mem -t "$T" chr21.fa r1.fq r2.fq)
            h=$(t_of "$HEAD_BIN" mem -t "$T" chr21.fa r1.fq r2.fq)
            m=$(t_of $M2 mem -t "$T" chr21.fa r1.fq r2.fq)
            echo "rep $rep: base=${b}s head=${h}s (bwa-mem2 canary ${m}s)"
            awk -v a="$h" -v b="$b" 'BEGIN{exit !(a<b)}' && wins=$((wins+1))
            bb=$(awk -v a="$bb" -v b="$b" 'BEGIN{print (a=="")?b:(b<a?b:a)}')
            hh=$(awk -v a="$hh" -v b="$h" 'BEGIN{print (a=="")?b:(b<a?b:a)}')
            mm=$(awk -v a="$mm" -v b="$m" 'BEGIN{print (a=="")?b:(b<a?b:a)}')
          done
          echo
          echo "== whole-process A/B, best of 3, same runner =="
          echo "base ${bb}s | head ${hh}s | bwa-mem2 canary ${mm}s | head wins ${wins}/3"
          awk -v b="$bb" -v h="$hh" 'BEGIN{printf "head vs base: %.4fx  (%+.2f%%)\n", b/h, 100*(b-h)/b}'
          echo "NOTE: shared-runner VM, single chromosome. Not the headline ratio; see README."

      # Does SMT pay for a memory-latency-bound aligner? This is the one machine question this repo
      # cannot ask at home: Apple Silicon has no SMT, every x86 server does, and the mechanism is
      # exactly our bottleneck (one thread computes while the other waits on DRAM). Published
      # pointer-chase concurrency is 30 on Granite Rapids and 58 on Zen 5 against 28 on an M4, so the
      # per-core miss capacity an SMT sibling shares is larger here than anything measured locally.
      #
      # Appended to this job rather than given its own, because the index and the reads are already
      # built by the steps above and rebuilding them would cost another hour.
      - name: SMT probe (physical cores vs all hardware threads)
        shell: bash
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket'
          TPC=$(lscpu | awk -F: '/Thread\(s\) per core/{gsub(/ /,"",$2); print $2}')
          LOG=$(nproc)
          PHYS=$(( LOG / TPC ))
          echo "logical=$LOG threads_per_core=$TPC physical=$PHYS"
          if [ "$TPC" -lt 2 ]; then
            echo "This runner reports one thread per core, so SMT cannot be measured here."
            exit 0
          fi
          t_of() { /usr/bin/time -f '%e %U %S' -o w.txt "$@" >/dev/null 2>/dev/null; cat w.txt; }
          # Interleaved, three pairs, so a drifting shared VM cannot fake a winner.
          for rep in 1 2 3; do
            p=$(t_of "$HEAD_BIN" mem -t "$PHYS" chr21.fa r1.fq r2.fq)
            l=$(t_of "$HEAD_BIN" mem -t "$LOG" chr21.fa r1.fq r2.fq)
            echo "rep $rep: -t$PHYS -> ${p}   -t$LOG -> ${l}   (wall user sys)"
          done
          echo "Read the wall column: if -t$LOG beats -t$PHYS, SMT is hiding memory latency for us."

  # Can a hosted runner even get 1 GB pages? BWA-MEM-SCALE (ICPP'22) measures +10.9 percentage points
  # from HugeTLB with 1 GB pages, and `crates/bwa-index/src/hugepage.rs` already establishes that
  # 2 MiB THP is worth ~1.7x on the seeding stage AND that mimalloc already obtains it. So the only
  # unpaid part of that lever is the step from 2 MiB to 1 GB, which mimalloc does not take.
  #
  # This job answers "is it reachable" before any allocation code is written for it. Writing an
  # mmap(MAP_HUGETLB | MAP_HUGE_1GB) path first, on a machine that cannot run it, would be building
  # on a guess. It runs in about a minute and is independent of the two benchmark jobs.
  hugepage-probe:
    name: are 1 GB pages obtainable on a hosted runner
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: What the kernel offers
        run: |
          echo "== CPU support (pdpe1gb means 1 GB pages exist in silicon) =="
          grep -o -E 'pdpe1gb|pse' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          echo
          echo "== page sizes the kernel exposes =="
          ls -1 /sys/kernel/mm/hugepages/ 2>/dev/null || echo "(no hugepages sysfs)"
          echo
          for d in /sys/kernel/mm/hugepages/hugepages-*; do
            [ -d "$d" ] || continue
            echo "$(basename "$d"): nr=$(cat "$d/nr_hugepages") free=$(cat "$d/free_hugepages")"
          done
          echo
          echo "== THP =="
          cat /sys/kernel/mm/transparent_hugepage/enabled 2>/dev/null || echo "(none)"
          echo
          echo "== boot cmdline (hugepagesz= here means 1 GB was reserved at boot) =="
          cat /proc/cmdline

      - name: Try to reserve at runtime
        run: |
          # 2 MiB first, as the control: if even this fails the runner forbids reservation outright
          # rather than 1 GB being special.
          for sz in 2048kB 1048576kB; do
            d=/sys/kernel/mm/hugepages/hugepages-$sz
            [ -d "$d" ] || { echo "$sz: not exposed by this kernel"; continue; }
            want=4
            echo "$want" | sudo tee "$d/nr_hugepages" >/dev/null 2>&1 || echo "$sz: write refused"
            got=$(cat "$d/nr_hugepages")
            echo "$sz: asked $want, got $got"
          done
          echo
          echo "== can we mount hugetlbfs =="
          sudo mkdir -p /mnt/huge && sudo mount -t hugetlbfs none /mnt/huge 2>&1 \
            && { echo "mounted"; mount | grep hugetlbfs; sudo umount /mnt/huge; } \
            || echo "mount refused"

      - name: Verdict
        run: |
          d=/sys/kernel/mm/hugepages/hugepages-1048576kB
          if [ -d "$d" ] && [ "$(cat $d/nr_hugepages)" -gt 0 ]; then
            echo "1 GB pages ARE obtainable here: the lever is testable in CI."
          else
            echo "1 GB pages are NOT obtainable on this runner."
            echo "That does not kill the lever, it kills testing it here: it stays a deployment"
            echo "note for users with a tuned host, not something this repo can measure or ship on."
          fi
