# The AVX-512 kernels of #44, executed at last (#44).
#
# Those kernels have byte-identity tests and for months the tests never RAN: they self-skip when
# `is_x86_feature_detected!("avx512bw")` is false, and every GitHub draw this project has taken has
# been an AMD EPYC 7763 (Zen 3) or an EPYC 9V74 (Zen 4 with the flag masked by the hypervisor).
# Twenty-three dispatches, three runner images, zero `avx512bw`. A kernel that has never executed is
# not "untimed", it is unverified.
#
# The QEMU idea DID NOT WORK, and the second job below records why so nobody spends the afternoon
# again. QEMU's x86 TCG gained AVX and AVX2 in 7.2 and still has **no AVX-512** in 8.2.2, which is
# what ubuntu-24.04 ships: `is_x86_feature_detected!("avx512bw")` answers false under `-cpu max`,
# and forcing the tests to run anyway dies with `uncaught target signal 4 (Illegal instruction)`.
#
# **Intel SDE does work**, and it is what the first job uses. SDE is a Pin-based functional emulator
# written by the people who define the ISA; `-spr` presents a Sapphire Rapids, CPUID and XCR0
# included, so Rust's own feature detection selects the AVX-512 kernels the way it would on real
# silicon. It is a plain tarball download (Intel Simplified Software License, no registration), not
# an apt package, which is the only reason it was not tried earlier. It is pinned by SHA-256 here.
#
# What SDE proves and what it does NOT:
#
#   - proves: the kernels execute, and every cell they compute equals `fwd_local_sw_scalar`, over
#     the same generated sweep the AVX2 twins pass on real hardware. That is the whole correctness
#     half of #44, and the standing risk that an Intel user auto-selects never-executed code.
#   - does not prove: anything at all about speed. SDE is an interpreter, roughly two orders of
#     magnitude off, and the port pressure that the whole of #44 is about does not exist inside it.
#     The +11% to +40% still needs an Ice Lake or Sapphire/Emerald Rapids core, per #32's machine.
name: avx512-check

# Dispatch is not enough. A check that only runs when someone remembers it is a check that rots,
# and these kernels are the ones nobody can run by accident: no hosted runner has the silicon, so a
# regression in them would reach a user's Sapphire Rapids before it reached any log. So the SDE job
# also runs on any pull request that touches the crate holding them, and weekly on the schedule, half
# an hour after CI's own Monday slot so the two do not queue against each other.
on:
  workflow_dispatch:
    inputs:
      run_qemu:
        description: "Also run the QEMU job (expected to fail: no AVX-512 in TCG, kept as a record)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "crates/bwa-neon/**"
      - ".github/workflows/avx512-check.yml"
  schedule:
    - cron: "30 6 * * 1"  # Mondays 06:30 UTC

# One run of this workflow at a time per ref. Without it a second push while the first run is still
# measuring leaves two hour-long jobs racing for the same runners, which happened four times while
# this branch was being written and had to be cleaned up by hand.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  avx512-sde:
    name: "AVX-512 kernels under Intel SDE (${{ matrix.chip }}), byte-identity only"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # The FLOOR, and it is the arm that can fail on its own. Runtime dispatch selects these
          # kernels on `avx512bw` alone, which Skylake-X has, and Skylake-X has neither VBMI nor
          # VNNI. SDE aborts on any instruction the selected chip lacks, so this arm is the guard
          # against LLVM (or a future edit) reaching for `vpermb` or a newer form inside a block
          # gated only on BW: on real Skylake-X that would be a SIGILL in a user's alignment.
          - chip: skx
          # The TARGET of #44: Golden Cove server, where the port pressure the issue is about lives.
          # The instruction mix is taken here, not on the floor arm, because this is the model the
          # cycle counting in the issue was done against.
          - chip: spr
    env:
      # Pinned, both the URL and the hash. An emulator that silently changed under us would turn a
      # green tick back into the thing this workflow exists to prevent: a claim with nothing behind
      # it. Bump deliberately, and say in the commit what the new version was checked against.
      SDE_URL: https://downloadmirror.intel.com/843185/sde-external-9.48.0-2024-11-25-lin.tar.xz
      SDE_SHA256: 3173d2a5369e3385226b488d8b75403951bc14af601435fe707d9f83e0b533e6
      SDE_DIR: sde-external-9.48.0-2024-11-25-lin
    steps:
      - uses: actions/checkout@v7

      - name: What the host has (and does not)
        run: |
          echo "model: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
          # No `-m1`: with `-o` it counts MATCHES, not matching lines, so it printed exactly one
          # flag out of the three on the same `flags` line. That bug hid an AVX-512 host for a run.
          echo -n "simd: "; grep -o -E 'avx2|avx512bw|avx512f|avx512vl' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          if grep -q avx512bw /proc/cpuinfo; then
            echo "NOTE: this draw HAS avx512bw natively, which has never happened; the SDE run below still stands"
          else
            echo "NOTE: no avx512bw on this draw, which is why the emulator exists"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"

      - uses: Swatinem/rust-cache@v2

      - name: Fetch Intel SDE
        run: |
          curl -fsSL -o sde.tar.xz "$SDE_URL"
          echo "$SDE_SHA256  sde.tar.xz" | sha256sum -c -
          tar xf sde.tar.xz
          "./$SDE_DIR/sde64" -version | head -3
          # Pin injects itself with ptrace, which Ubuntu's Yama LSM restricts to descendants by
          # default. Without this SDE dies with "Pin is unable to attach". It is a runner-local
          # setting on a throwaway VM.
          sudo sysctl -w kernel.yama.ptrace_scope=0

      - name: Build the test binaries
        env:
          # No `-C target-cpu`: the kernels are selected at RUNTIME by feature detection, and a
          # target-cpu that promises AVX-512 to the whole binary would let the compiler emit those
          # instructions in code that is NOT feature-gated, which would then fault on a real host
          # rather than fall back. The point is to exercise the dispatch, not to bypass it.
          RUSTFLAGS: ""
        run: |
          # `--message-format=json` names the executables cargo built, which is the only reliable way
          # to find them: the hash suffix is not predictable, and a `find` over target/release/deps
          # picks up whatever else is lying there (the first attempt at this step ran `rustc`).
          #
          # `.target.test == true` is load-bearing and cost a run: without it the first executable
          # cargo reports is the `bench_batch` EXAMPLE, which runs happily under emulation, prints a
          # throughput table, and proves nothing about any kernel's correctness.
          cargo test -p bwa-mem4-neon --release --no-run --message-format=json \
            | jq -r 'select(.executable != null and .target.test == true) | .executable' | tee /tmp/testbins
          test -s /tmp/testbins || { echo "cargo built no test binary" >&2; exit 1; }

      - name: "Run the AVX-512 byte-identity tests on an emulated ${{ matrix.chip }}"
        run: |
          set -o pipefail
          bin=$(head -1 /tmp/testbins)
          echo "binary: $bin"
          sde="./$SDE_DIR/sde64"
          # `-${{ matrix.chip }}`: SDE faults on any instruction the selected chip does not have,
          # so the run proves the kernels stay inside that model's ISA and not merely inside
          # `avx512bw`, which is all the runtime dispatch checks before selecting them.
          #
          # First pass deliberately does NOT set BWA4_TEST_FORCE_AVX512: what SDE presents to
          # `is_x86_feature_detected!` is itself part of what is being checked, and under QEMU that
          # is exactly what failed (instructions emulated, XCR0 bits absent, tests skipped, `ok`).
          "$sde" -${{ matrix.chip }} -- "$bin" avx512 --nocapture --test-threads 1 2>&1 | tee /tmp/out.txt
          if grep -q 'skipping avx512' /tmp/out.txt; then
            echo "SDE did not expose avx512bw to feature detection; re-running with the override"
            BWA4_TEST_FORCE_AVX512=1 "$sde" -${{ matrix.chip }} -- "$bin" avx512 --nocapture --test-threads 1 2>&1 | tee /tmp/out.txt
          fi
          # Three gates, because each of them has silently passed at some point in this file's life:
          # a skip must not be reported as `ok`, the filter must actually have matched tests, and
          # all three AVX-512 tests must be among them.
          if grep -q 'skipping avx512' /tmp/out.txt; then
            echo "an AVX-512 test skipped: nothing was proved" >&2
            exit 1
          fi
          ran=$(grep -c -E '^test .*avx512.* \.\.\. ok$' /tmp/out.txt || true)
          echo "avx512 tests executed: $ran"
          if [ "$ran" -lt 3 ]; then
            echo "expected 3 avx512 tests (matesw u8, matesw i16, batched u8+i16), got $ran" >&2
            exit 1
          fi

      - name: Prove the XOR score table really issued, not a fallback
        if: matrix.chip == 'spr'
        run: |
          set -o pipefail
          bin=$(head -1 /tmp/testbins)
          sde="./$SDE_DIR/sde64"
          # The point of #44 part A is that the scoring block became `vpxor` + `vpshufb`. A dynamic
          # instruction mix says whether those really issued, which no source review can. One test is
          # enough for the question and keeps the emulated run short.
          "$sde" -spr -mix -omix /tmp/mix.txt -- \
            "$bin" avx512_matesw_u8_matches_scalar --nocapture --test-threads 1 > /dev/null 2>&1
          # SDE's mix names opcodes WITHOUT an operand-width tag (`VPSHUFB`, not `VPSHUFB_ZMM`), so
          # the 512-bit-ness comes from the `*isa-ext-AVX512EVEX` counter, not from the mnemonic.
          # Counting a mnemonic that AVX2 also has would prove nothing.
          n() { grep -E "^$1[[:space:]]" /tmp/mix.txt | awk '{print $2}' | sort -n | tail -1; }
          evex=$(n '\*isa-ext-AVX512EVEX'); evex=${evex:-0}
          shuf=$(n VPSHUFB); shuf=${shuf:-0}
          xord=$(n VPXORD); xorq=$(n VPXORQ)
          echo "--- what the kernel executed, dynamic counts ---"
          printf 'AVX512EVEX %s\nVPSHUFB %s\nVPXORD %s\nVPXORQ %s\nVPMAXUB %s\nVMOVDQU8 %s\nVPCMPUB %s\n' \
            "$evex" "$shuf" "${xord:-0}" "${xorq:-0}" "$(n VPMAXUB)" "$(n VMOVDQU8)" "$(n VPCMPUB)" | column -t
          grep -o 'fwd_local_sw_avx512_u8[^ ]*' /tmp/mix.txt | head -1
          if [ "$evex" -lt 1000000 ]; then
            echo "only $evex EVEX-encoded instructions: the u8 test did not reach the AVX-512 kernel" >&2
            exit 1
          fi
          if [ "$shuf" -eq 0 ]; then
            echo "no VPSHUFB: the XOR score table of #44 part A did not execute" >&2
            exit 1
          fi
          # LLVM picks either encoding for the same xor, so the check is on the pair, not on one.
          if [ $(( ${xord:-0} + ${xorq:-0} )) -eq 0 ]; then
            echo "no VPXORD/VPXORQ: the score table was indexed by something other than the XOR" >&2
            exit 1
          fi
          if ! grep -q 'dynamic-counts-for-function: .*fwd_local_sw_avx512_u8' /tmp/mix.txt; then
            echo "the kernel does not appear in the per-function mix: it was never entered" >&2
            exit 1
          fi

      - name: Keep the mix
        if: always() && matrix.chip == 'spr'
        uses: actions/upload-artifact@v4
        with:
          name: sde-instruction-mix
          path: /tmp/mix.txt
          if-no-files-found: warn

  avx512-qemu:
    name: "QEMU (kept as a record: TCG has no AVX-512)"
    if: ${{ inputs.run_qemu }}
    # 24.04, not 22.04, and it is not cosmetic: 22.04 ships qemu 6.2, which ADVERTISES avx512 in
    # CPUID under `-cpu max` and then faults on the first such instruction. The first attempt died
    # with "uncaught target signal 4 (Illegal instruction)" for exactly that reason. AVX-512
    # emulation was expected in qemu 7.2 and is not there either; 24.04 ships 8.2.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"

      - uses: Swatinem/rust-cache@v2

      - name: Install qemu-user
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user
          qemu-x86_64 --version | head -1

      - name: Build the test binaries
        env:
          RUSTFLAGS: ""
        run: |
          cargo test -p bwa-mem4-neon --release --no-run --message-format=json \
            | jq -r 'select(.executable != null and .target.test == true) | .executable' | tee /tmp/testbins
          test -s /tmp/testbins || { echo "cargo built no test binary" >&2; exit 1; }

      - name: Run them under an emulated AVX-512 CPU
        run: |
          bin=$(head -1 /tmp/testbins)
          echo "binary: $bin"
          qemu-x86_64 -cpu max /usr/bin/lscpu 2>/dev/null | grep -o -E 'avx512bw|avx512f' | sort -u || true
          # qemu-user emulates the instructions it has but does not present the XCR0 bits Rust's
          # `is_x86_feature_detected!` checks, so without this the AVX-512 tests skip and report
          # `ok` — the silence this workflow exists to break. With it, the run dies with SIGILL,
          # which is a correct and loud answer.
          export BWA4_TEST_FORCE_AVX512=1
          qemu-x86_64 -cpu max "$bin" --nocapture --test-threads 2 2>&1 | tail -40 > /tmp/out.txt || {
            echo "TESTS FAILED under emulation"; cat /tmp/out.txt; exit 1; }
          cat /tmp/out.txt
          if ! grep -qE 'avx512.*(ok|FAILED)' /tmp/out.txt; then
            echo "no avx512 test executed: emulation did not expose the feature" >&2
            exit 1
          fi
          if grep -q 'skipping avx512' /tmp/out.txt; then
            echo "an AVX-512 test skipped despite the override: emulation did not expose the kernels" >&2
            exit 1
          fi
