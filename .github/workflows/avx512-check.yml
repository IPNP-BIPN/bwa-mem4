# The AVX-512 kernels of #44, executed at last (#44).
#
# Those kernels have byte-identity tests and the tests have never RUN: they self-skip when
# `is_x86_feature_detected!("avx512bw")` is false, and every GitHub draw this project has taken has
# been an AMD EPYC 7763 (Zen 3, no AVX-512). Seventeen consecutive draws on 2026-08-09, and two more
# today. A kernel that has never executed is not "untimed", it is unverified.
#
# Emulation separates the two halves of that problem. `qemu-x86_64 -cpu max` implements avx512bw, so
# the feature detection returns true and the kernels really run: their results are then checked
# against the scalar reference by the same gates that guard every other backend. What emulation
# cannot give is a TIMING, and this workflow deliberately measures none. Speed stays open until an
# Intel runner appears; correctness does not have to wait for one.
name: avx512-check

on:
  # TEMPORARY, removed before this branch merges (a workflow_dispatch workflow is only reachable by
  # name once its file is on the default branch).
  push:
    branches: [perf/alloc-probe]
    paths: [".github/workflows/avx512-check.yml"]
  workflow_dispatch:

jobs:
  avx512-emulated:
    name: AVX-512 kernels under qemu, byte-identity only
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: What the host has (and does not)
        run: |
          echo "model: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
          echo -n "simd: "; grep -o -E 'avx2|avx512bw|avx512f|avx512vl' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          if grep -q avx512bw /proc/cpuinfo; then
            echo "NOTE: this draw HAS avx512bw, so the native tests below are the real thing"
          else
            echo "NOTE: no avx512bw on this draw, which is why the emulated run exists"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"

      - uses: Swatinem/rust-cache@v2

      - name: Install qemu-user
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user

      - name: Build the test binaries
        env:
          # No `-C target-cpu`: the kernels are selected at RUNTIME by feature detection, and a
          # target-cpu that promises AVX-512 to the whole binary would let the compiler emit those
          # instructions in code that is NOT feature-gated, which would then fault on a real host
          # rather than fall back. The point is to exercise the dispatch, not to bypass it.
          RUSTFLAGS: ""
        run: |
          # `--message-format=json` names the executables cargo built, which is the only reliable way
          # to find them: the hash suffix is not predictable, and a `find` over target/release/deps
          # picks up whatever else is lying there (the first attempt at this step ran `rustc`).
          #
          # `.target.test == true` is load-bearing and cost a run: without it the first executable
          # cargo reports is the `bench_batch` EXAMPLE, which runs happily under qemu, prints a
          # throughput table, and proves nothing about any kernel's correctness.
          cargo test -p bwa-mem4-neon --release --no-run --message-format=json \
            | jq -r 'select(.executable != null and .target.test == true) | .executable' | tee /tmp/testbins
          test -s /tmp/testbins || { echo "cargo built no test binary" >&2; exit 1; }

      - name: Run them under an emulated AVX-512 CPU
        run: |
          # `-cpu max` gives qemu's widest model, which includes avx512f/bw/vl. If a future qemu
          # renames it, the assertion below fails loudly instead of silently testing SSE again.
          bin=$(head -1 /tmp/testbins)
          echo "binary: $bin"
          test -x "$bin" || { echo "not executable: $bin" >&2; exit 1; }
          # First, prove the emulated CPU really advertises what we need. `avx512_u8_and_i16_match_scalar`
          # self-skips otherwise, and a skipped test reports `ok`, which is exactly the failure mode
          # this workflow exists to prevent.
          qemu-x86_64 -cpu max /usr/bin/lscpu 2>/dev/null | grep -o -E 'avx512bw|avx512f' | sort -u || true
          qemu-x86_64 -cpu max "$bin" --nocapture --test-threads 2 2>&1 | tail -40 > /tmp/out.txt || {
            echo "TESTS FAILED under emulation"; cat /tmp/out.txt; exit 1; }
          cat /tmp/out.txt
          # A run where the AVX-512 test self-skipped is a run that proved nothing. The kernels print
          # nothing on success, so the check is on the test names having executed at all.
          if ! grep -qE 'avx512.*(ok|FAILED)' /tmp/out.txt; then
            echo "no avx512 test executed: emulation did not expose the feature" >&2
            exit 1
          fi
          if grep -q 'skipped' /tmp/out.txt; then
            echo "WARNING: something self-skipped; read the list above" >&2
          fi
