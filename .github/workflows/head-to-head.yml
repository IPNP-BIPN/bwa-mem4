# Where we stand against fg-labs/bwa-mem3 on x86, with the binary we now ship.
#
# Every head-to-head this project has recorded on x86 used a plain baseline build, because that is
# what we shipped. Since then two things changed what a user gets: the x86 tarballs carry an
# `x86-64-v3` binary (5.6-6.8% on its own), and the release artefacts no longer carry PGO, which was
# costing 3.3% on this platform. Projecting the ratio from those two numbers would be arithmetic;
# this job measures it.
#
# Four binaries, one host, interleaved: our baseline build, our v3 build, the fork, and bwa-mem2 as
# the drift canary that says whether the machine moved under the measurement.
#
# First result, 2026-08-19, at the commit before the extension-job dedup landed. Simulated reads:
# baseline 208.81 / 209.68 / 209.71 s, v3 200.70 / 200.76 / 202.12, fork 151.45 / 152.78 / 152.66.
# Real reads: baseline 118.60 / 121.39 / 119.20, v3 107.74 / 108.54 / 108.60, fork 103.82 / 109.85 /
# 108.60. So the v3 binary is worth 4% on simulated and 9.1% on real reads, and on real reads it
# puts us within 4% of the fork, level on one repetition and ahead on another. Two datasets, because
# the gap is data-dependent and one number has already proved misleading: simulated reads, where we
# were 1.32x behind, and real HG002 reads, where we were level.
#
# The third arm, v3+tight (BWA4_TIGHT_BAND), is the ungapped-score band clamp: on an M4 it beats the
# source-built fork 7/7 on both datasets (chr21 33.18-33.60 vs 35.28-35.86; real GIAB 12.02-12.28 vs
# 12.19-12.40), md5-identical on both plus the 64-arm option matrix. This job is its x86 verdict,
# and the identity step fails the run if it moves a byte here.
name: head-to-head
# rev: 2026-08-20b scratch-hoist (relaunch marker; the push trigger is path-filtered to this file)

on:
  workflow_dispatch:
    inputs:
      read_pairs:
        description: "Simulated pairs (the real-read arm is sliced from GIAB and sized by the window)"
        default: "2000000"
        required: false
      # Every head-to-head recorded here is an AMD EPYC 7763 number, because `ubuntu-22.04` is
      # uniformly Zen 3. The residual gap against the fork is an x86 question and a CPU is not a
      # vendor: `ubuntu-24.04` now draws parts that expose avx512bw, including Intel Emerald Rapids,
      # where our 512-bit kernels are the ones that run and the fork's tier builds meet ours on
      # different ground.
      runner:
        description: "Runner image (ubuntu-22.04 | ubuntu-24.04)"
        default: "ubuntu-22.04"
        required: false
      require_avx512:
        description: "Fail fast unless the runner has avx512bw (re-draw until an AVX-512 host)"
        type: boolean
        default: false
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  head-to-head:
    name: bwa-mem4 baseline and v3, against the fork and bwa-mem2
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-22.04' }}
    # 180, not 120: five binaries, three repetitions, two datasets plus warm-ups is 34 alignments at
    # 100-210 s each on this runner, and the 120-minute ceiling killed the first five-arm run inside
    # its final identity step.
    timeout-minutes: 180
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7

      - name: Log the host
        shell: bash
        run: |
          echo "model: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
          # No `-m1`: with `-o` it counts matches, not lines, so it printed one flag out of the
          # several on the same `flags` line and hid an AVX-512 host for a whole run elsewhere.
          echo -n "simd: "; grep -o -E 'avx2|avx512bw|avx512f|avx512vl' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          echo "nproc: $(nproc)"
          if [ "${{ github.event.inputs.require_avx512 }}" = "true" ]; then
            grep -q avx512bw /proc/cpuinfo || {
              echo "::error::this draw has no avx512bw; re-dispatch until an AVX-512 host comes up"
              exit 1
            }
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"

      - uses: Swatinem/rust-cache@v2

      - name: Install bwa-mem2 + bwa-mem3 + wgsim + samtools (bioconda)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: bench
          condarc: |
            channels:
              - conda-forge
              - bioconda
          create-args: >-
            bwa-mem2
            bwa-mem3
            wgsim
            samtools
          init-shell: bash

      - name: Build both of ours
        shell: bash
        run: |
          set -euo pipefail
          # One target dir, rebuilt per level: three of them do not fit a hosted runner, and
          # changing RUSTFLAGS invalidates the cache anyway. --jobs 2 because a full rebuild of the
          # dependency tree has had this runner reclaimed under it twice.
          RUSTFLAGS="" cargo build --release --locked -p bwa-mem4 --jobs 2 --target-dir target-isa
          cp target-isa/release/bwa-mem4 ./mem4-baseline
          RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build --release --locked -p bwa-mem4 --jobs 2 \
            --target-dir target-isa
          cp target-isa/release/bwa-mem4 ./mem4-v3
          ls -la mem4-baseline mem4-v3

      - name: Reference, index, and both read sets
        run: |
          set -euo pipefail
          mkdir -p work && cd work
          url="https://ftp.ensembl.org/pub/release-110/fasta/homo_sapiens/dna/Homo_sapiens.GRCh38.dna.chromosome.21.fa.gz"
          curl -fsSL --retry 3 "$url" -o chr21.fa.gz && gunzip -f chr21.fa.gz
          # The benchmark's contig must be named as the GIAB BAM names it, or the slice below has
          # nothing to fetch; bwa-mem2's indexer is what all four binaries read.
          sed -i '1s/.*/>chr21/' chr21.fa
          bwa-mem2 index chr21.fa
          n="${{ github.event.inputs.read_pairs || '2000000' }}"
          wgsim -S 11 -N "$n" -1 150 -2 150 chr21.fa sim1.fq sim2.fq > /dev/null
          echo "simulated: $n pairs"
          bam="https://ftp-trace.ncbi.nlm.nih.gov/ReferenceSamples/giab/data/AshkenazimTrio/HG002_NA24385_son/NIST_HiSeq_HG002_Homogeneity-10953946/NHGRI_Illumina300X_AJtrio_novoalign_bams/HG002.GRCh38.300x.bam"
          samtools view -@ 4 -b -s 0.5 "$bam" chr21:20000000-30000000 > slice.bam
          samtools collate -@ 4 -u -O slice.bam \
            | samtools fastq -@ 4 -1 real1.fq -2 real2.fq -0 /dev/null -s /dev/null -n
          echo "real: $(( $(wc -l < real1.fq) / 4 )) pairs"

      - name: Head to head
        run: |
          set -euo pipefail
          cd work
          T="$(nproc)"; [ "$T" -gt 8 ] && T=8
          timed() { /usr/bin/time -f '%e' -o t.txt "$@" > /dev/null 2>/dev/null; cat t.txt; }
          for set in sim real; do
            r1="${set}1.fq"; r2="${set}2.fq"
            echo; echo "===== $set reads ====="
            # Warm every binary: on a cold page cache the first of four looks slower for reasons
            # that have nothing to do with the aligner.
            for b in ../mem4-baseline ../mem4-v3; do $b mem -t "$T" chr21.fa "$r1" "$r2" >/dev/null 2>/dev/null; done
            bwa-mem3 mem -t "$T" chr21.fa "$r1" "$r2" >/dev/null 2>/dev/null
            env BWA4_TIGHT_BAND=1 ../mem4-v3 mem -t "$T" chr21.fa "$r1" "$r2" >/dev/null 2>/dev/null
            for rep in 1 2 3; do
              b0=$(timed ../mem4-baseline mem -t "$T" chr21.fa "$r1" "$r2")
              b3=$(timed ../mem4-v3       mem -t "$T" chr21.fa "$r1" "$r2")
              tb=$(timed env BWA4_TIGHT_BAND=1 ../mem4-v3 mem -t "$T" chr21.fa "$r1" "$r2")
              fk=$(timed bwa-mem3         mem -t "$T" chr21.fa "$r1" "$r2")
              m2=$(timed bwa-mem2         mem -t "$T" chr21.fa "$r1" "$r2")
              echo "rep $rep: baseline ${b0}s | v3 ${b3}s | v3+tight ${tb}s | fork ${fk}s | mem2 ${m2}s"
            done
          done

      # The fork's bioconda binary prints bwa-mem2's full runtime profile (tprof) on stderr at the
      # end of EVERY run — SMEM compute, MEM_CHAIN, SAL/MEM_SA, BSW, WORKER_SAM — and every
      # head-to-head so far threw stderr away. This step finally reads it, next to our own probes on
      # the same data, so the wgsim gap stops being one opaque number and becomes a per-stage diff:
      #   SMEM compute ~ align:seed | MEM_CHAIN ~ align:chain | SAL/MEM_SA ~ get_sa_batch
      #   BSW ~ the extension kernels | WORKER_SAM ~ dedup_prep + pestat + rescue + sam_emit
      - name: Where each side spends it, stage by stage
        run: |
          set -euo pipefail
          cd work
          T="$(nproc)"; [ "$T" -gt 8 ] && T=8
          for set in sim real; do
            r1="${set}1.fq"; r2="${set}2.fq"
            echo; echo "===== $set: the fork's own profile ====="
            bwa-mem3 mem -t "$T" chr21.fa "$r1" "$r2" > /dev/null 2> fk.err || { tail -5 fk.err; exit 1; }
            sed -n '/Runtime profile/,/Important parameter/p' fk.err | grep -vE '^\s*$' | head -30
            echo; echo "===== $set: ours (v3 build, one batch in flight so shares are exact) ====="
            env BWA4_NO_BATCH_OVERLAP=1 BWA4_STAGE_TIME=1 BWA4_CHAIN_TIME=1 BWA4_EMIT_SPLIT=1 BWA4_RESCUE_SPLIT=1 \
              ../mem4-v3 mem -t "$T" chr21.fa "$r1" "$r2" > /dev/null 2> m4.err
            grep -E '^\[(stage-time|chain-time|emit-split|rescue-split)\]' m4.err
          done

      - name: And the two of ours still agree
        run: |
          set -euo pipefail
          cd work
          T="$(nproc)"; [ "$T" -gt 8 ] && T=8
          for set in sim real; do
            a=$(../mem4-baseline mem -t "$T" chr21.fa "${set}1.fq" "${set}2.fq" 2>/dev/null | grep -v '^@PG' | md5sum)
            b=$(../mem4-v3       mem -t "$T" chr21.fa "${set}1.fq" "${set}2.fq" 2>/dev/null | grep -v '^@PG' | md5sum)
            c=$(env BWA4_TIGHT_BAND=1 ../mem4-v3 mem -t "$T" chr21.fa "${set}1.fq" "${set}2.fq" 2>/dev/null | grep -v '^@PG' | md5sum)
            [ "$a" = "$b" ] || { echo "::error::$set: v3 output differs from baseline"; exit 1; }
            [ "$a" = "$c" ] || { echo "::error::$set: TIGHT BAND output differs from baseline"; exit 1; }
            echo "$set: identical across all three ($a)"
          done
