[package]
name = "bwa-mem4-io"
description = "FASTA/FASTQ input and hand-formatted SAM output for bwa-mem4, byte-controlled to match bwa-mem2 exactly."
readme = "../../README.md"
keywords = ["bioinformatics", "alignment", "genomics", "bwa"]
categories = ["science"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
bwa-core = { workspace = true }
needletail = { workspace = true }
# Format sniffing for the `multi-format` feature. Default features, deliberately: niffler's own
# `bz2`/`lzma`/`zstd` features only add the wrapper, and the backing `*-sys` crates are configured
# by the `bzip2/default` and `liblzma/default` entries in ITS default set, so subtracting them
# produces a graph that does not link. Taking the default also pulls its gzip path, which costs
# nothing here: features are additive, so our `flate2/zlib-rs` still wins, and gzip input never
# reaches niffler anyway (`fastq::open_reader` recognises it first).
niffler = { version = "3", optional = true }
# Fast inflate backend for gzipped FASTQ input. ON by default via bwa-cli's `default` feature.
#
# needletail constructs the decompressor itself (`flate2::read::MultiGzDecoder`), so we cannot pass
# it one. We do not have to: flate2 picks its backend by CARGO FEATURE, and features are additive
# across the dependency graph, so enabling `zlib-rs` on OUR flate2 dependency switches needletail's
# flate2 too, with no change to needletail and no code here.
#
# The default resolution is `miniz_oxide`, the slowest mainstream inflate. In paired-end mode ONE
# reader thread inflates both mate files (see `PairedFastqReader`), so this is the whole input
# path's throughput.
#
# `zlib-rs` over `zlib-ng`: same speed class, pure Rust, so no cmake and no C toolchain, which is
# why this can be a default at all. Measured on 1M real GIAB pairs, PE `-t12`, `.fq.gz` input, the
# `wait_read` stage goes 0.786s -> 0.48s (-38%); zlib-ng landed at 0.565s, between the two. See
# docs/perf-levers.md for why that is a ~1.2% ceiling on wall and therefore below the 3% floor.
#
# Cannot affect output: inflate is a bijection, so every backend yields the same decompressed bytes,
# hence the same records, hence the same `-K` batch boundaries. Verified: all three backends emit
# the same SAM md5 (`67aa384bcc8af01f3618f1816f6b7606`) on gzipped real GIAB input.
flate2 = { version = "1.1", optional = true, default-features = false, features = [
    "zlib-rs",
] }
# Parallel inflate for gzipped FASTQ input, ON by default via bwa-cli's `default` feature.
#
# Why a second gzip dependency when `zlib-rs` is already fast. The reader's exposure is a LATENCY
# problem, not a throughput one: the first batch of a run has no predecessor to overlap with, and
# under the default `-K = 10M * threads` that first batch grows with `-t`. Measured on 1M real GIAB
# pairs at `-t16`, one batch covering the whole file, `wait_read` is 0.414s gzipped against 0.107s
# plain, and a whole-file single-stream inflate is 0.392s: after the inflater moved to its own
# thread (see `spawn_inflate`), the gzip reader is almost entirely inflate, and the parser waits.
#
# Measured decode rate on that file, output bytes per second:
#
#   zlib-rs             823-876 MB/s
#   rapidgzip 1 thread  917-937 MB/s
#   rapidgzip 4         ~1240 MB/s
#   rapidgzip 8         ~2240 MB/s
#   rapidgzip 12        2863-2999 MB/s
#
# So it is faster even single-threaded, and 3.4x at 12. The threads it spends are free where they
# matter: during the first batch every aligner worker is idle by construction.
#
# It cannot affect output for the same reason every other backend cannot: inflate is a bijection.
# Verified, `-K 20M` on GIAB, gzipped input and the same reads uncompressed produce the same SAM.
#
# No C toolchain: 23 transitive crates, all pure Rust, and the runtime ones (`zlib-rs`,
# `crossbeam-deque`) are already in this graph via `flate2` and rayon. `bon` is build-time only.
#
# 0.3.1 is a floor, not a preference: 0.3.0 carries a lost-wakeup race in the shared decoder pool
# that hangs a run outright on paired gzip input at higher thread counts.
rapidgzip-core = { version = "0.3.1", optional = true }

[features]
# xz-compressed FASTQ input, through needletail. ON by default, so the binary
# reads exactly what it read before. Turning default features off drops the
# `liblzma` dependency and with it the `links = "lzma"` clash against `lzma-sys`
# (`zip`/`xz2`, `hts-sys`), which is what lets a library consumer that already
# links one of those depend on this crate at all.
xz-input = ["needletail/xz2"]
# NOT defaulted here on purpose: the binary crate (bwa-cli) owns the default, so that a
# `cargo build -p bwa-mem4 --no-default-features` can actually reach back and turn it off. A default
# here would be un-disableable from the binary's build line, since bwa-cli takes bwa-io with its
# default features.
# Swap the gzip decompressor for zlib-rs. Additive and code-free; see the dependency comment above.
fast-gzip = ["dep:flate2"]
# Decode gzipped FASTQ in parallel (rapidgzip-core). Implies `fast-gzip`, which stays the fallback
# for non-seekable input and for a build that turns this off.
parallel-gzip = ["dep:rapidgzip-core", "fast-gzip"]
# Accept bzip2, xz and zstd FASTQ input as well as plain and gzip. OFF by default, for three reasons
# that are worth stating precisely, because the obvious one is wrong.
#
# The obvious-and-wrong one: "it would add a C toolchain requirement". Not for the shipped binary. It
# already needs a C compiler for `rust-htslib`, and since the suffix-array backend moved to the C
# libsais it needs one twice over. This crate ON ITS OWN is C-free today (flate2 runs on `zlib-rs`,
# pure Rust), and that is the only sense in which the claim holds.
#
# The real ones, measured:
#   * build time: +11 s on a cold release build (25 s -> 36 s in the CI container), which is the
#     three vendored C libraries compiling. None of them needs a system package.
#   * binary size: 3 041 952 -> 3 148 064 bytes, +3.5%.
#   * supply chain: three more C libraries to track for advisories, for a format nobody has asked
#     for yet.
#
# And it is an extension rather than parity: `bwa-mem2` reads none of the three. What the feature
# must NOT do is change the output, which is what the tests assert: the same reads spelled five
# different ways parse to the same records, and a chromosome-scale run from `.zst` produces the same
# SAM md5 as from `.gz`.
#
# Plain and gzip input do not go through niffler even when this is on (see `fastq::open_reader`), so
# the default path keeps the zlib-rs inflate measured at -38% against miniz_oxide.
multi-format = ["dep:niffler"]

[lints]
workspace = true
