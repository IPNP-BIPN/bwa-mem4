[package]
name = "bwa-mem4-index"
description = "FM-index construction and loading for bwa-mem4, producing index files byte-identical to bwa-mem2 index."
readme = "../../README.md"
keywords = ["bioinformatics", "alignment", "genomics", "bwa"]
categories = ["science"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# The package is renamed for crates.io, but the LIBRARY keeps its original name: targets in
# this same package (examples/star_vs_fm.rs, examples/sa_batch_bench.rs, examples/bwt_binning.rs, tests/index_byte_identity.rs) refer to it as `bwa_index`.
[lib]
name = "bwa_index"

[dependencies]
bwa-core = { workspace = true }
rayon = { workspace = true }
memmap2 = { workspace = true }
# Optional faster suffix-array construction (index BUILD only). Off by default: the default build
# uses the in-tree pure-Rust SA-IS and stays byte-identical with zero extra dependencies. With
# `--features libsais` the SA is built by libsais-rs instead (a pure-Rust translation of Ilya
# Grebnov's libsais, no C toolchain). A suffix array is UNIQUE, so the produced index is byte-identical
# either way; `scripts/index_diff.sh` is the gate. Only `index` speed changes, never `mem` output.
# NOTE the naming trap, since these two crates are one hyphen apart and are different projects:
#   `libsais-rs` = henriksson-lab/libsais-rs, a pure-Rust TRANSLATION of libsais, no C toolchain.
#   `libsais`    = feldroop/libsais-rs, BINDINGS to Ilya Grebnov's C libsais (vendored source).
# Both are used here, under the features below, and they produce identical suffix arrays.
libsais-rs = { version = "0.2", optional = true }
# Bindings to Ilya Grebnov's C libsais, with OpenMP. Optional and OFF by default: it needs a C
# toolchain and an OpenMP runtime at build time, which the pure-Rust translation above exists to
# avoid. What it buys, measured on the 2L text of chr21 (93 M bases) and chr1 (498 M bases), suffix
# arrays identical to the Rust translation's in every case:
#
#   chr21: pure Rust 3.27s | C 1 thread 1.95s | 4 threads 1.05s | 8 threads 0.85s | 16 threads 1.22s
#   chr1:  pure Rust 20.15s | C 1 thread 12.21s | 4 threads 5.85s | 8 threads 4.63s | 16 threads 7.27s
#
# So about 4.3x on the stage that dominates `bwa-mem4 index`, and note the knee: past 8 threads
# libsais's own parallel sections start losing to their coordination.
libsais = { version = "0.2", optional = true, default-features = false }
# Optional CaPS-SA suffix-array construction (index BUILD only). Cache-friendly parallel sample-sort
# SACA (COMBINE-lab port); exposes both an in-memory build and an EXTERNAL-MEMORY (bounded-RAM) build.
# A suffix array is UNIQUE, so the produced index is byte-identical either way; only build speed / peak
# build RAM changes, never `mem` output. Enabled with `--features capsa`. Experimental (spike).
caps-sa = { version = "0.6", optional = true }

[features]
# `BWA4_TRAFFIC` cache-line counters in `backward_ext`, `get_sa` and `get_sa_batch`. OFF by default,
# and compiled out entirely rather than merely branch-predicted away: these three sites sit on the
# hottest path in the crate (`backward_ext` alone runs ~1e9 times per 500k pairs), and the identical
# pattern in `bwa-seed` measured ~3% of CPU when it was an unconditional runtime check. Turn it on to
# size a memory-traffic question, never for production.
traffic = []
# libsais is ON by default: it builds the suffix array via libsais-rs (a pure-Rust, Apache-2.0
# translation of Ilya Grebnov's libsais), ~3x faster to build than the in-tree SA-IS and BYTE-IDENTICAL
# (a suffix array is unique; gated by scripts/index_diff.sh). `--no-default-features` falls back to the
# dependency-free SA-IS. Only `index` build speed changes, never `mem` output.
default = ["libsais-c"]
# The pure-Rust translation. No longer the default, kept as the escape hatch for a build with no C
# compiler at all (the CLI needs one anyway for rust-htslib, but this crate on its own does not).
libsais = ["dep:libsais-rs"]
# Ilya Grebnov's C libsais, serial. This is the default: it needs a C compiler and nothing else (the
# C source is vendored by the crate, there is no system package to install), and it is 1.7x faster
# than the Rust translation before any threading enters the picture.
libsais-c = ["dep:libsais"]
# ... and with OpenMP, which is where the 4.3x is. Needs libomp at build time: present on Linux with
# gcc, needs `brew install libomp` on macOS. Off by default for that reason alone.
libsais-c-omp = ["libsais-c", "libsais/openmp"]
# Experimental CaPS-SA backend (spike). Not in `default`. In-memory build ~ libsais-class speed, plus a
# bounded-RAM external-memory build that libsais/SA-IS cannot do. Byte-identical (a SA is unique).
capsa = ["dep:caps-sa"]

[[example]]
name = "libsais_parity"
required-features = ["libsais"]

[[example]]
name = "capsa_parity"
required-features = ["capsa"]

[lints]
workspace = true

[[example]]
name = "unpack_bench"
