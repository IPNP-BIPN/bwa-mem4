[package]
name = "bwa-mem4-mem"
description = "Alignment core for bwa-mem4: extension, dedup, primary marking, MAPQ, CIGAR, tags and paired-end."
readme = "../../README.md"
keywords = ["bioinformatics", "alignment", "genomics", "bwa"]
categories = ["science"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
bwa-core = { workspace = true }
bwa-index = { workspace = true }
bwa-seed = { workspace = true }
bwa-chain = { workspace = true }
bwa-extend = { workspace = true }
# SIMD kernels: the batched mate-rescue local-SW (self-dispatching NEON/scalar).
bwa-neon = { workspace = true }

[lints]
workspace = true

[features]
# Compiles the `BWA4_ALIGN_SPLIT` timers into the align stage. Off by default: the wrappers sit
# around `run_side` and `extend_batch`, and even with the flag unset they cost measurable CPU by
# standing between the caller and the inliner. Turn on to locate a hot spot, not to ship.
align-split = []
