[package]
name = "bwa-mem4"
description = "A native Rust reimplementation of the bwa-mem2 short-read aligner, indexer included, whose acceptance criterion is byte-identical output: the same index files and the same SAM bytes."
readme = "../../README.md"
keywords = ["bioinformatics", "alignment", "genomics", "bwa", "sam"]
categories = ["science", "command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "bwa-mem4"
path = "src/main.rs"

[dependencies]
bwa-core = { workspace = true }
bwa-chain = { workspace = true }
bwa-io = { workspace = true }
bwa-index = { workspace = true }
bwa-mem = { workspace = true }
bwa-neon = { workspace = true }
clap = { workspace = true }
mimalloc = { workspace = true }
anyhow = { workspace = true }
rayon = { workspace = true }
bgzf = { workspace = true }
rust-htslib = { workspace = true }
rammap-core = "1.1.2"

[features]
# Passthrough for `bwa-io`'s multi-format FASTQ input (bzip2, xz, zstd). Off by default: it pulls
# three C compression libraries. See crates/bwa-io/Cargo.toml for why they are not optional inside
# niffler's own feature set.
multi-format = ["bwa-io/multi-format"]
# Suffix-array backend passthrough for `bwa-mem4 index`. `bwa-index` owns the actual choice (see
# crates/bwa-index/Cargo.toml); this exists so the streaming CaPS-SA backend can be selected when
# building the BINARY, which is the only way a user reaches `bwa-mem4 index`:
#
#     cargo build --release -p bwa-mem4 --features capsa
#
# Purely ADDITIVE, and deliberately so: `bwa-index`'s own `libsais` default is force-enabled across
# the workspace by feature unification (bwa-seed/bwa-chain/bwa-mem all depend on bwa-index with
# default features), so a `--no-default-features` here could not turn it off. `capsa` therefore
# takes precedence over `libsais` inside `bwa-index` via `cfg(not(feature = "capsa"))` rather than
# by being mutually exclusive with it. Byte-identical either way (a suffix array is unique); only
# index build speed and peak build RAM change, never `mem` output.
capsa = ["bwa-index/capsa"]

# Fast gzip input passthrough. ON by default through `bwa-io`'s own default; this entry exists so
# the binary's build line can still name it, and so `--no-default-features` has something to turn
# off when a build wants the stock miniz_oxide inflate:
#
#     cargo build --release -p bwa-mem4 --no-default-features
#
# No external build tool: the backend is `zlib-rs`, pure Rust. See crates/bwa-io/Cargo.toml.
default = ["fast-gzip"]
fast-gzip = ["bwa-io/fast-gzip"]

[lints]
workspace = true
