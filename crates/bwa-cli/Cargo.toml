[package]
name = "bwa-mem4"
description = "A native Rust reimplementation of the bwa-mem2 short-read aligner, indexer included, whose acceptance criterion is byte-identical output: the same index files and the same SAM bytes."
readme = "../../README.md"
keywords = ["bioinformatics", "alignment", "genomics", "bwa", "sam"]
categories = ["science", "command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "bwa_mem4"
path = "src/lib.rs"

[[bin]]
name = "bwa-mem4"
path = "src/main.rs"

[dependencies]
bwa-core = { workspace = true }
bwa-chain = { workspace = true }
bwa-io = { workspace = true }
bwa-index = { workspace = true }
bwa-mem = { workspace = true }
bwa-neon = { workspace = true }
clap = { workspace = true }
mimalloc = { workspace = true, optional = true }
anyhow = { workspace = true }
rayon = { workspace = true }
bgzf = { workspace = true }
rust-htslib = { workspace = true, optional = true }
rammap-core = "1.1.2"

[features]
# Per-stage timing counters in bwa-mem4-mem. Off by default: the wrapper is a barrier the inliner
# does not always see through, and it costs measurable CPU even with BWA4_ALIGN_SPLIT unset.
align-split = ["bwa-mem/align-split"]
# The allocation probe's global-allocator wrapper (`BWA4_STAGE_ALLOC`, see src/stage_alloc.rs). Off
# by default for the same reason as `align-split`, and measured: the wrapper's disabled path is one
# relaxed bool load and an untaken branch, but it sits on EVERY allocation, and this pipeline makes
# 167M of them per 500k GIAB pairs. Interleaved A/B, min of 6 on a quiet host: 12.49 s -> 12.56 s
# real and 95.14 s -> 95.67 s user, i.e. +0.5%, which is not a tax a shipped aligner should pay for
# a diagnostic. Everything else in the probe (the stage tags, the per-batch counters) is per stage
# or per batch and stays compiled in, so only this feature moves the allocator itself:
#
#     cargo build --release -p bwa-mem4 --features stage-alloc
#
# Without it, `BWA4_STAGE_ALLOC` prints a line saying the binary cannot answer and changes nothing.
stage-alloc = ["bwa-mem/stage-alloc"]
# Passthrough for `bwa-io`'s multi-format FASTQ input (bzip2, xz, zstd). Off by default: +11 s of
# build time, +3.5% of binary, and three more C libraries in the supply chain, for formats bwa-mem2
# does not read. NOT because it introduces a C toolchain requirement: this binary already has one,
# for `rust-htslib` and for the C libsais. See crates/bwa-io/Cargo.toml.
multi-format = ["bwa-io/multi-format"]
# Passthrough for `bwa-io`'s xz-compressed FASTQ input. In the default set, so
# the binary is unchanged; `default-features = false` drops it, and with it the
# `links = "lzma"` collision that otherwise makes this crate impossible to
# depend on alongside `zip` or `hts-sys`. See crates/bwa-io/Cargo.toml.
xz-input = ["bwa-io/xz-input"]
# Suffix-array backend passthrough for `bwa-mem4 index`. `bwa-index` owns the actual choice (see
# crates/bwa-index/Cargo.toml); this exists so the streaming CaPS-SA backend can be selected when
# building the BINARY, which is the only way a user reaches `bwa-mem4 index`:
#
#     cargo build --release -p bwa-mem4 --features capsa
#
# Purely ADDITIVE, and deliberately so: `bwa-index`'s own `libsais` default is force-enabled across
# the workspace by feature unification (bwa-seed/bwa-chain/bwa-mem all depend on bwa-index with
# default features), so a `--no-default-features` here could not turn it off. `capsa` therefore
# takes precedence over `libsais` inside `bwa-index` via `cfg(not(feature = "capsa"))` rather than
# by being mutually exclusive with it. Byte-identical either way (a suffix array is unique); only
# index build speed and peak build RAM change, never `mem` output.
capsa = ["bwa-index/capsa"]
# OpenMP passthrough for the C libsais suffix-array build (`bwa-mem4 index` only, never `mem`).
# Off by default because it is the one feature here that needs a SYSTEM package: `openmp-sys` wants
# an OpenMP runtime at build time (`brew install libomp`, or libgomp from the distro's gcc), which
# the vendored C source cannot supply. Everything else in this manifest builds from the crates.io
# tarball alone, and a release artifact that silently gained a dylib dependency would be worse than
# a slower index build.
#
# A suffix array is UNIQUE, so this cannot move a byte of any index or any SAM record; only the
# build's wall time and thread count change. Thread count comes from `BWA4_SA_THREADS`, defaulting
# to `min(rayon threads, 8)` because libsais's own parallel sections start losing past that.
#
#     brew install libomp
#     cargo build --release -p bwa-mem4 --features libsais-c-omp
libsais-c-omp = ["bwa-index/libsais-c-omp"]

# Fast gzip input passthrough. ON by default through `bwa-io`'s own default; this entry exists so
# the binary's build line can still name it, and so `--no-default-features` has something to turn
# off when a build wants the stock miniz_oxide inflate:
#
#     cargo build --release -p bwa-mem4 --no-default-features
#
# No external build tool: the backend is `zlib-rs`, pure Rust. See crates/bwa-io/Cargo.toml.
default = ["fast-gzip", "parallel-gzip", "xz-input", "hts-output", "mimalloc"]
# Binary BAM/CRAM output (`-o out.bam`, `-o out.cram`), through rust-htslib. In
# the default set, so the binary is unchanged. Turning it off drops `rust-htslib`
# and with it `hts-sys`, bindgen, clang and the C toolchain they need, which is
# most of what a library consumer pays for when it only ever asks for SAM. SAM
# and BGZF output are unaffected either way; both are pure Rust.
hts-output = ["dep:rust-htslib"]
# mimalloc as the binary's global allocator. In the default set, so `bwa-mem4`
# is built exactly as before. It exists as a feature because a
# `#[global_allocator]` is a whole-program decision and this crate now has a
# library target: an embedder that links `bwa_mem4` should not have one chosen
# for it. Nothing in the library uses it.
mimalloc = ["dep:mimalloc"]
fast-gzip = ["bwa-io/fast-gzip"]
# Parallel inflate for gzipped FASTQ, ON by default. Turning it off falls back to the single-thread
# zlib-rs inflater, which is still on its own thread. See crates/bwa-io/Cargo.toml for the measured
# decode rates and for why this is a latency lever rather than a throughput one.
parallel-gzip = ["bwa-io/parallel-gzip"]

[lints]
workspace = true
